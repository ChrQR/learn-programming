# Serves the prerendered SvelteKit site. Routes are files like /setup.html and
# /lessons/variables.html, so try the exact path, then path.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/wasm;

    # Hashed build assets can be cached forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

}
